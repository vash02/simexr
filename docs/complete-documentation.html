<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimExR Complete Documentation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }
        .nav-buttons {
            text-align: center;
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #0366d6;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 0 10px;
        }
        .content {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="header">
        <h1>📚 Complete Documentation</h1>
        <p>Comprehensive SimExR Framework Guide</p>
    </div>

    <div class="nav-buttons">
        <a href="documentation.html" class="btn">← Main Page</a>
        <a href="api-reference.html" class="btn">API Reference</a>
        <a href="quick-start.html" class="btn">Quick Start</a>
        <a href="examples.html" class="btn">Examples</a>
    </div>

    <div class="content">
        <div id="markdown-content" class="loading">
            📖 Loading documentation...
        </div>
    </div>

    <script>
        // Fetch and render markdown content
        fetch('COMPLETE_DOCUMENTATION.md')
            .then(response => response.text())
            .then(markdown => {
                document.getElementById('markdown-content').innerHTML = marked.parse(markdown);
            })
            .catch(error => {
                document.getElementById('markdown-content').innerHTML = 
                    '<p>❌ Error loading documentation. Please try refreshing the page.</p>';
            });
    </script>
</body>
</html>
